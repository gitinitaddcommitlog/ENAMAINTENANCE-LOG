<div class="page-header">
    <h2>Reports</h2>
</div>

<!-- Report Selection Cards -->
<div class="reports-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
    <!-- Vehicle History Report Card -->
    <div class="chart-card">
        <div class="card-header">
            <h3><i class="fas fa-truck"></i> Vehicle History Report</h3>
        </div>
        <div class="form-group" style="padding: 20px;">
            <label>Select Vehicle</label>
            <select id="vehicleSelect" class="report-select" style="width: 100%; padding: 10px; margin: 10px 0;">
                <option value="">-- Select Vehicle --</option>
            </select>
            <button class="add-btn" onclick="generateVehicleReport()" style="width: 100%;">
                <i class="fas fa-file-pdf"></i> Generate Vehicle History
            </button>
        </div>
    </div>

    <!-- Monthly Cost Report Card -->
    <div class="chart-card">
        <div class="card-header">
            <h3><i class="fas fa-calendar-alt"></i> Monthly Cost Report</h3>
        </div>
        <div class="form-group" style="padding: 20px;">
            <label>Select Month</label>
            <select id="monthSelect" class="report-select" style="width: 100%; padding: 10px; margin: 10px 0;">
                <option value="">-- Select Month --</option>
            </select>
            <button class="add-btn" onclick="generateMonthlyReport()" style="width: 100%;">
                <i class="fas fa-file-excel"></i> Generate Monthly Report
            </button>
        </div>
    </div>
</div>

<!-- Report Display Section (hidden initially) -->
<div id="reportDisplay" style="display: none;">
    <div class="table-card">
        <div class="card-header">
            <h3 id="reportTitle"></h3>
            <div>
                <button class="export-btn" onclick="exportToExcel()" style="margin-right: 10px;">
                    <i class="fas fa-file-excel"></i> Excel
                </button>
                <button class="export-btn" onclick="exportToPDF()">
                    <i class="fas fa-file-pdf"></i> PDF
                </button>
            </div>
        </div>
        <div class="table-responsive" id="reportTable"></div>
    </div>
</div>

<!-- Summary Cards (hidden initially) -->
<div class="kpi-grid" style="margin-top: 20px; display: none;" id="summaryCards">
    <div class="kpi-card total-spent">
        <div class="kpi-icon"><i class="fas fa-cedi-sign"></i></div>
        <div class="kpi-content">
            <h3>Total Spent</h3>
            <div class="kpi-value" id="reportTotal">0</div>
        </div>
    </div>
    <div class="kpi-card active-vehicles">
        <div class="kpi-icon"><i class="fas fa-tools"></i></div>
        <div class="kpi-content">
            <h3>Jobs Count</h3>
            <div class="kpi-value" id="reportCount">0</div>
        </div>
    </div>
    <div class="kpi-card avg-cost">
        <div class="kpi-icon"><i class="fas fa-chart-line"></i></div>
        <div class="kpi-content">
            <h3>Average Cost</h3>
            <div class="kpi-value" id="reportAvg">0</div>
        </div>
    </div>
</div>

<!-- Script -->
<script src="reports.js"></script>
