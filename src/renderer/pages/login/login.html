<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ENA MAINTENANCE - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a2b3c 0%, #2a3b4c 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 350px;
        }
        .login-box h2 {
            color: #1a2b3c;
            margin-bottom: 30px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #dde;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #4a9eff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background: #3a8eef;
        }
        .error {
            color: #ff4444;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>ENA MAINTENANCE LOG</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" value="admin@logbook">
            <input type="password" id="password" placeholder="Password" value="Get@access">
            <button type="submit">Login</button>
            <div id="errorMsg" class="error"></div>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const result = await window.api.auth.login(username, password);
                if (result.success) {
                    window.location.href = '../../index.html';
                } else {
                    document.getElementById('errorMsg').textContent = result.message;
                }
            } catch (err) {
                document.getElementById('errorMsg').textContent = 'Login error';
            }
        });
    </script>
</body>
</html>
