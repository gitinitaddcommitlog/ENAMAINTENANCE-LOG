<div class="page-header">
    <h2>Maintenance Records</h2>
    <button class="add-btn" onclick="showAddMaintenanceModal()">
        <i class="fas fa-plus"></i> Add New Record
    </button>
</div>

<div class="maintenance-table">
    <table class="data-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Vehicle</th>
                <th>Mechanic</th>
                <th>Fault</th>
                <th>Parts</th>
                <th>Total Cost</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="maintenanceList">
            <tr><td colspan="7" class="loading-row">Loading records...</td></tr>
        </tbody>
    </table>
</div>

<!-- Add Maintenance Modal -->
<div id="maintenanceModal" class="modal" style="display: none;">
    <div class="modal-content" style="width: 500px;">
        <h3 id="modalTitle">Add Maintenance Record</h3>
        
        <div class="form-group">
            <label>Vehicle</label>
            <select id="vehicleId" required>
                <option value="">Select Vehicle</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Mechanic</label>
            <select id="mechanicId" required>
                <option value="">Select Mechanic</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Service Date</label>
            <input type="date" id="serviceDate" required>
        </div>
        
        <div class="form-group">
            <label>Nature of Fault</label>
            <input type="text" id="natureOfFault" placeholder="e.g., Oil change, Brake repair" required>
        </div>
        
        <div class="form-group">
            <label>Parts Used</label>
            <input type="text" id="partName" placeholder="e.g., Oil filter, Brake pads">
        </div>
        
        <div class="form-row" style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
                <label>Parts Cost (GHS)</label>
                <input type="number" id="itemCost" value="0" min="0">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Labor Cost (GHS)</label>
                <input type="number" id="workmanshipCost" value="0" min="0">
            </div>
        </div>
        
        <div class="form-group">
            <label>Remarks</label>
            <textarea id="remarks" rows="2" placeholder="Additional notes"></textarea>
        </div>
        
        <div class="form-group">
            <label>Next Maintenance Date</label>
            <input type="date" id="nextMaintenanceDate">
        </div>
        
        <div class="modal-actions">
            <button class="save-btn" onclick="saveMaintenance()">
                <i class="fas fa-save"></i> Save Record
            </button>
            <button class="cancel-btn" onclick="hideMaintenanceModal()">
                <i class="fas fa-times"></i> Cancel
            </button>
        </div>
    </div>
</div>

<script src="maintenance.js"></script>
